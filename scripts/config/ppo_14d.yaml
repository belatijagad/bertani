# Focused 14-day experiment: the original learning representation and joint
# PPO, plus the 17-slot capacity optimization and rule-based economy.

max_updates: 300
optimizer_kwargs: {lr: 1e-4, eps: 0.000_3}
clip_gradients: 10.0
steps_per_update: 128
epochs_per_update: 1
train_batch_size: 512
use_mixed_precision: true

gpu_config:
  compile_model: true
  compile_mode: default
  channels_last: true
  fused_optimizer: true
  preload_rollout: true
  allow_tf32: true
  cudnn_benchmark: true

gamma: 0.9999
gae_lambda: 0.85
clip_coefficient: 0.2
loss_coefficients: {value: 0.5, entropy: 1e-4}
normalize_advantages: true
include_workforce: true

env_config:
  n_envs: 256
  seed: 2026
  episode_steps: 336
  turns_per_day: 24

self_play_config:
  opponent: v16
  opponent_path: baselines/v16_rc5/main.py
  reward: net_worth_delta
  reward_scale: 10_000
  terminal_score: net_worth
  max_hires_per_turn: 2

rl_model_config:
  d_model: 64
  n_blocks: 5
  kernel_size: 3
  dropout: 0.0
  max_hands: 16
  workforce_prior_hands: 5
  workforce_prior_std: 2.0

device: cuda
checkpoint_path: outputs/ppo-14d-fast-original/latest.pt
resume: null
checkpoint_every: 25
metrics_file: outputs/ppo-14d-fast-original/metrics.jsonl
progress: true
profile: false
cprofile: null
