# Training
max_updates: 1_000
optimizer_kwargs:
  lr: 1e-4
  eps: 0.000_3
clip_gradients: 10.0
steps_per_update: 32
epochs_per_update: 1
train_batch_size: 128
use_mixed_precision: true

# PPO
gamma: 0.9999
gae_lambda: 0.85
clip_coefficient: 0.2
loss_coefficients:
  value: 0.5
  entropy: 1e-4
normalize_advantages: true
include_workforce: true

env_config:
  n_envs: 32
  seed: 2026

self_play_config:
  opponent_path: references/v9_main_restarted.py
  # margin_delta, terminal_margin, or win_loss
  reward: margin_delta
  # rule-scaffold or workforce-only
  market: rule-scaffold
  max_hires_per_turn: 2

rl_model_config:
  d_model: 64
  n_blocks: 5
  kernel_size: 3
  dropout: 0.0
  max_hands: 16

# Runtime and outputs. Relative paths resolve from the repository root.
device: cuda
checkpoint_path: outputs/ppo/latest.pt
resume: null
checkpoint_every: 25
metrics_file: outputs/ppo/metrics.jsonl
progress: true
profile: false
cprofile: null
