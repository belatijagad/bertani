# Training
max_updates: 100
optimizer_kwargs:
  lr: 1e-4
  eps: 0.000_3
clip_gradients: 10.0
steps_per_update: 64
epochs_per_update: 1
train_batch_size: 1024
use_mixed_precision: true

gpu_config:
  compile_model: true
  # default has much lower warm-up cost on consumer GPUs. Larger accelerators
  # can try max-autotune-no-cudagraphs for long runs.
  compile_mode: default
  channels_last: true
  fused_optimizer: true
  preload_rollout: true
  allow_tf32: true
  cudnn_benchmark: true

# PPO
gamma: 0.9999
gae_lambda: 0.85
clip_coefficient: 0.2
loss_coefficients:
  value: 0.5
  entropy: 1e-4
normalize_advantages: true
include_workforce: true

env_config:
  n_envs: 512
  seed: 2026

self_play_config:
  opponent: v16
  opponent_path: baselines/v16_rc5/main.py
  # net_worth_delta, margin_delta, terminal_margin, or win_loss
  reward: margin_delta
  reward_scale: 10_000
  opening: none
  # rule-scaffold or workforce-only
  market: rule-scaffold
  max_hires_per_turn: 2

rl_model_config:
  d_model: 64
  n_blocks: 5
  kernel_size: 3
  dropout: 0.0
  max_hands: 16
  workforce_prior_hands: null
  workforce_prior_std: 2.0

# Runtime and outputs. Relative paths resolve from the repository root.
device: cuda
checkpoint_path: outputs/ppo-v16/latest.pt
resume: null
checkpoint_every: 25
metrics_file: outputs/ppo-v16/metrics.jsonl
progress: true
profile: false
cprofile: null
