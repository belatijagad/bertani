# Net-worth reward experiment. This keeps the PPO/model settings and frozen
# V16 opponent fixed while replacing bank-only shaping with an economic-value
# potential and a terminal correction to the exact final coin margin.

# Training
max_updates: 100
optimizer_kwargs:
  lr: 1e-4
  eps: 0.000_3
clip_gradients: 10.0
steps_per_update: 64
epochs_per_update: 1
train_batch_size: 1024
use_mixed_precision: true

gpu_config:
  compile_model: true
  compile_mode: default
  channels_last: true
  fused_optimizer: true
  preload_rollout: true
  allow_tf32: true
  cudnn_benchmark: true

# PPO
gamma: 0.9999
gae_lambda: 0.85
clip_coefficient: 0.2
loss_coefficients:
  value: 0.5
  entropy: 1e-4
normalize_advantages: true
include_workforce: true

env_config:
  n_envs: 512
  seed: 2026

self_play_config:
  opponent: v16
  opponent_path: baselines/v16_rc5/main.py
  reward: net_worth_delta
  reward_scale: 10_000
  opening: none
  market: rule-scaffold
  max_hires_per_turn: 2

rl_model_config:
  d_model: 64
  n_blocks: 5
  kernel_size: 3
  dropout: 0.0
  max_hands: 16
  workforce_prior_hands: null
  workforce_prior_std: 2.0

device: cuda
checkpoint_path: outputs/ppo-v16-net-worth/latest.pt
resume: null
checkpoint_every: 25
metrics_file: outputs/ppo-v16-net-worth/metrics.jsonl
progress: true
profile: false
cprofile: null
